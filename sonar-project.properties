sonar.projectKey=vieteats-api
sonar.projectName=VietEats API
sonar.sources=src
sonar.tests=tests
sonar.exclusions=node_modules/**,coverage/**,reports/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Quality gate thresholds referenced in the report (configured in the SonarQube server UI):
# - Coverage on new code >= 70%
# - Duplicated lines on new code <= 5%
# - Maintainability rating on new code = A

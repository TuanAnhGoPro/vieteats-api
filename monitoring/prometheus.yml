global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "vieteats-api-prod"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]
